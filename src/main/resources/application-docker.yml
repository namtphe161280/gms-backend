spring:
  datasource:
    url: jdbc:mysql://mysql:3306/gms?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: demo
    password: 123456
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  main:
    allow-bean-definition-overriding: true

sms:
  viettel:
    api-url: https://api.vietteltelecom.vn/sms/send
    user-id: ${VIETTEL_USER_ID}
    service-id: ${VIETTEL_SERVICE_ID}
    sender: ${VIETTEL_SENDER}

services:
  gms-backend:
    environment:
      - VIETTEL_USER_ID=${VIETTEL_USER_ID}
      - VIETTEL_SERVICE_ID=${VIETTEL_SERVICE_ID}
      - VIETTEL_SENDER=${VIETTEL_SENDER}

server:
  port: 8080